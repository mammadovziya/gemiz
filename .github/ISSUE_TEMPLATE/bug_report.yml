name: Bug report
description: Report a reproducible Gemiz problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, input type, and relevant output.
      render: bash
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "OS, Python version, Gemiz commit"
    validations:
      required: true

